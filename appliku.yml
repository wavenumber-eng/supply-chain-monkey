build_settings:
  build_image: python-3.13-uv
  container_port: 8000

services:
  web:
    # The legacy v1 SSE route carries its token in the query string. Disable
    # Uvicorn access logs so that compatibility token can never be recorded.
    command: bash -c 'PYTHONPATH=/code/src/py uvicorn scm.server.main:app --host 0.0.0.0 --port 8000 --no-access-log'

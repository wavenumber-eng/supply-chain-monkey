[project]
name = "scm"
version = "1.0.0"
description = "Supply Chain Monkey — contract, client, and server"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
client = [
    "requests>=2.32.0",
]
server = [
    "requests>=2.32.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
]
ai = [
    "anthropic>=0.52.0",
]

[dependency-groups]
dev = [
    "requests>=2.32.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pytest>=8.0.0",
    "pytest-json-report",
    "httpx>=0.27.0",
    "wn-rack>=1.1.0",
    "pyright>=1.1.390",
    "ruff>=0.8.0",
]

[tool.uv]
package = false

[tool.uv.sources]
wn-rack = { git = "https://github.com/wavenumber-eng/wn-rack.git" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src/py"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
markers = [
    "slow: long-running or live supplier validation",
    "supplier: live supplier integration coverage",
    "requires_credentials: test requires provider credentials",
    "benchmark: timing-oriented supplier validation",
]

[project]
name = "supply-chain-monkey"
version = "2026.8.12"
description = "Supply Chain Monkey contract, client, and server"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic>=2.0",
    "requests>=2.32.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
client = [
    "requests>=2.32.0",
]
server = [
    "requests>=2.32.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
]
ai = [
    "anthropic>=0.52.0",
]

[project.urls]
Homepage = "https://github.com/wavenumber-eng/supply-chain-monkey"
Repository = "https://github.com/wavenumber-eng/supply-chain-monkey"

[dependency-groups]
dev = [
    "anthropic>=0.52.0",
    "build>=1.2.0",
    "pytest>=8.0.0",
    "pytest-json-report",
    "httpx>=0.27.0",
    "pyright>=1.1.390",
    "ruff>=0.8.0",
    "twine>=5.0.0",
    "wn-rack>=1.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
sources = ["src/py"]

[tool.hatch.build.targets.wheel]
packages = ["src/py/scm"]
core-metadata-version = "2.4"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"

[tool.uv]
# Copy instead of hardlink: venv may live on a different volume than the uv
# cache, where hardlinking fails (os error 396).
link-mode = "copy"
package = false
default-groups = []

[tool.uv.sources]

[tool.wn_dev_std]
profile = "python-package"
standard_version = "2026.8.12"
distribution = "appliku-service"
languages = ["python"]
strict = false
artifact_policy = "transient-dist"

[tool.wn_dev_std.documentation.plans]
roots = ["docs/plans/active"]
ignore = [
    "docs/plans/LIB_CRUNCHER_INTEGRATION_PLAN.md",
    "docs/plans/SUPPLY_CHAIN_MONKEY_SERVICE_TRANSITION_PLAN.md",
]

[tool.wn_dev_std.tests]
roots = ["tests"]
signoff_strata = ["L99_signoff"]

[tool.wn_dev_std.compatibility_pruning]
root = "."
forbidden_patterns = [
    "^\\s*(from|import)\\s+supply_chain_monkey\\b",
    "\\bsupply_chain_monkey\\.env\\b",
    "\\bensure_env_loaded\\b",
    "from\\s+\\.env\\s+import",
    "\\bWN_LIBZ_ROOT\\b",
]
excluded_parts = ["docs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src/py"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
markers = [
    "slow: long-running or live supplier validation",
    "supplier: live supplier integration coverage",
    "requires_credentials: test requires provider credentials",
    "benchmark: timing-oriented supplier validation",
]

[tool.pyright]
include = [
    "src/py/scm",
    "tests",
]
extraPaths = ["src/py"]
pythonVersion = "3.13"
typeCheckingMode = "basic"
reportMissingTypeStubs = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[workspace]

[package]
name = "alexandria-scm-consumer-proof"
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
publish = false

[dependencies]
scm-client = "=0.1.0"
tokio = { version = "1.53.1", features = ["macros"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

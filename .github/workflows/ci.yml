name: CI

on:
  push:
    branches: [main, dev, production]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
      - name: Sync dev tools
        run: uv sync --group dev
      - name: Run release signoff
        run: uv run rack run L99_signoff

name: Publish PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish distribution
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
      - name: Sync dev tools
        run: uv sync --group dev
      - name: Verify release identity
        shell: bash
        run: |
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          TAG="$(python -c 'import tomllib; v=tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]; y,m,d=(int(p) for p in v.split(".")); print(f"v{y:04d}-{m:02d}-{d:02d}")')"
          if [ "${GITHUB_EVENT_NAME}" = "release" ]; then
            test "${TAG}" = "${GITHUB_REF_NAME}"
          fi
          echo "Validated ${TAG} for ${VERSION}"
      - name: Run release signoff
        run: uv run rack run L99_signoff
      - name: Build distribution
        run: uv run python -m build --sdist --wheel --outdir dist
      - name: Check distribution
        run: uv run twine check dist/*
      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

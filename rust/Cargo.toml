[workspace]
members = [
  "src/scm-contracts",
  "src/scm-client",
  "src/scm-cli",
  "src/scm-codegen",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/wavenumber-eng/supply-chain-monkey"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
allow_attributes_without_reason = "deny"
cognitive_complexity = "deny"
too_many_arguments = "deny"
too_many_lines = "deny"

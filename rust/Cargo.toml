[workspace]
members = [
  "src/scm-contracts",
  "src/scm-client",
  "src/scm-cli",
  "src/scm-codegen",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/wavenumber-eng/supply-chain-monkey"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
allow_attributes_without_reason = "deny"
cognitive_complexity = "deny"
too_many_arguments = "deny"
too_many_lines = "deny"

[workspace.dependencies]
anyhow = "1.0.102"
futures-util = "0.3.32"
jsonschema = { version = "0.49.4", default-features = false }
prettyplease = "0.2.37"
regress = "0.11.1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "query", "rustls", "system-proxy"] }
schemars = "0.8.22"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
sha2 = "0.11.0"
syn = { version = "2.0.117", features = ["full"] }
thiserror = "2.0.18"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
typify = { version = "0.7.0", default-features = false }

[workspace.dependencies.axum]
version = "0.8.9"
default-features = false
features = ["http1", "json", "query", "tokio"]

[workspace.dependencies.axum-server]
version = "0.8.0"
default-features = false
features = ["tls-rustls"]

[workspace.dependencies.rcgen]
version = "0.14.5"
default-features = false
features = ["aws_lc_rs", "pem"]
